# Dedicated search plumbing base. Three 64-transition evaluations occur before
# the only 192-transition pruning rung.

experiment:
  environment: LunarLanderContinuous-v3
  algorithm: SAC
  policy: MlpPolicy
  variants:
    - mlp

environment:
  frame_stack: 1
  n_envs: 2

training:
  timesteps: 256
  seed: 42
  device: auto
  allow_cpu: true
  progress_bar: false

evaluation:
  episodes: 1
  frequency: 64

output:
  directory: outputs/search_sac_smoke
  tensorboard_log: runs/search_sac_smoke
  run_tag: null

sac:
  learning_rate: 0.00073
  learning_rate_schedule: linear
  policy_net_arch: [64, 64]
  buffer_size: 10000
  batch_size: 64
  ent_coef: auto
  gamma: 0.99
  tau: 0.01
  train_freq: 1
  gradient_steps: 2
  learning_starts: 64
