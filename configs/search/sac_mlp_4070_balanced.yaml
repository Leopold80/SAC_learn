# Serial, single-GPU TPE study. The 8-worker SAC learner preserves one update
# per collected transition while avoiding concurrent GPU trials.

base_config: ../sac/parallel/parallel_8env.yaml

study:
  name: sac_mlp_4070_balanced
  output_root: outputs/hyperparameter_search
  n_trials: 24
  seed: 42
  n_startup_trials: 8

pruner:
  # Evaluations occur every 10k transitions, so all ASHA rungs align exactly.
  min_resource: 100000
  reduction_factor: 2

parameters:
  sac.learning_rate:
    type: float
    low: 0.0001
    high: 0.001
    log: true
  sac.tau:
    type: float
    low: 0.003
    high: 0.03
    log: true
  sac.gamma:
    type: float
    low: 0.97
    high: 0.999
  sac.batch_size:
    type: categorical
    choices: [128, 256, 512]
  sac.ent_coef:
    type: categorical
    choices: [auto, auto_0.01, auto_0.1]

revalidation:
  top_k: 3
  seed_base: 1000
  min_seeds: 5
  max_seeds: 9
  evaluation_episodes: 50
