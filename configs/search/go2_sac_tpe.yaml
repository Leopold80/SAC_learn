# SAC hyperparameter search for Go2 locomotion (TPE + ASHA)

base_config: ../go2/sac_baseline.yaml

study:
  name: go2_sac_tpe
  output_root: outputs/search
  n_trials: 24
  seed: 42
  n_startup_trials: 8

pruner:
  min_resource: 500_000
  reduction_factor: 2

parameters:
  sac.learning_rate:
    type: float
    low: 0.0001
    high: 0.001
    log: true
  sac.tau:
    type: float
    low: 0.001
    high: 0.02
    log: true
  sac.gamma:
    type: float
    low: 0.97
    high: 0.999
  sac.batch_size:
    type: categorical
    choices: [128, 256, 512]
  sac.ent_coef:
    type: categorical
    choices: [auto, auto_0.01]
  sac.policy_net_arch:
    type: categorical
    choices:
      - [128, 128]
      - [256, 256]
      - [400, 300]
      - [512, 256]

revalidation:
  top_k: 3
  seed_base: 100
  min_seeds: 5
  max_seeds: 9
  evaluation_episodes: 50
