base_config: base/sac_parallel_smoke.yaml

study:
  name: smoke_sac_tpe
  output_root: outputs/hyperparameter_search
  n_trials: 2
  seed: 42
  n_startup_trials: 1

pruner:
  min_resource: 192
  reduction_factor: 2

parameters:
  sac.learning_rate:
    type: float
    low: 0.0003
    high: 0.001
    log: true

revalidation:
  top_k: 1
  seed_base: 1000
  min_seeds: 2
  max_seeds: 2
  evaluation_episodes: 1
