# Serial, single-GPU TPE study for the existing CUDA-oriented PPO capacity
# profile. The 16 worker rollout remains fixed for fair comparison.

base_config: ../ppo/parallel_large.yaml

study:
  name: ppo_mlp_4070_balanced
  output_root: outputs/hyperparameter_search
  n_trials: 24
  seed: 42
  n_startup_trials: 8

pruner:
  # Both rungs are complete 16 x 1024 PPO rollouts and 32,768-step evaluations.
  min_resource: 262144
  reduction_factor: 2

parameters:
  ppo.learning_rate:
    type: float
    low: 0.0001
    high: 0.001
    log: true
  ppo.clip_range:
    type: float
    low: 0.1
    high: 0.3
  ppo.gae_lambda:
    type: float
    low: 0.9
    high: 0.99
  ppo.gamma:
    type: float
    low: 0.98
    high: 0.9999
  ppo.ent_coef:
    type: float
    low: 0.0001
    high: 0.03
    log: true
  ppo.n_epochs:
    type: categorical
    choices: [3, 4, 6]
  ppo.batch_size:
    type: categorical
    choices: [128, 256, 512]

revalidation:
  top_k: 3
  seed_base: 1000
  min_seeds: 5
  max_seeds: 9
  evaluation_episodes: 50
