# PPO hyperparameter search for Go2 locomotion (TPE + ASHA)

base_config: ../go2/ppo_baseline.yaml

study:
  name: go2_ppo_tpe
  output_root: outputs/search
  n_trials: 24
  seed: 42
  n_startup_trials: 8

pruner:
  min_resource: 400_000   # divisible by rollout_size = 8 × 1000 = 8000
  reduction_factor: 2

parameters:
  ppo.learning_rate:
    type: float
    low: 0.0001
    high: 0.001
    log: true
  ppo.clip_range:
    type: float
    low: 0.1
    high: 0.3
  ppo.gae_lambda:
    type: float
    low: 0.9
    high: 0.99
  ppo.gamma:
    type: float
    low: 0.97
    high: 0.999
  ppo.ent_coef:
    type: float
    low: 0.0001
    high: 0.01
    log: true
  ppo.n_epochs:
    type: categorical
    choices: [5, 8, 10, 15]
  ppo.policy_net_arch:
    type: categorical
    choices:
      - [128, 128]
      - [256, 256]
      - [400, 300]
      - [512, 256]

revalidation:
  top_k: 3
  seed_base: 100
  min_seeds: 5
  max_seeds: 9
  evaluation_episodes: 50
