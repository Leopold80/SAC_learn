# Same-budget SAC comparison for learnable Gaussian RBF policies.
# Seven variants run sequentially; each receives 500,000 total transitions.

experiment:
  environment: LunarLanderContinuous-v3
  algorithm: SAC
  policy: MlpPolicy
  variants:
    - mlp
    - rbf_64
    - rbf_192
    - sac_rbf_matched
    - rbf_actor_mlp_critic_64
    - rbf_actor_mlp_critic_192
    - sac_rbf_actor_mlp_critic_matched

environment:
  # RBF variants use the same single Markov observation as the MLP baseline.
  frame_stack: 1
  n_envs: 8

training:
  timesteps: 500000
  seed: 42
  device: cuda
  allow_cpu: false
  progress_bar: true

evaluation:
  episodes: 10
  frequency: 10000

output:
  directory: outputs/lunarlander_sac_rbf
  tensorboard_log: runs/lunarlander_sac_rbf
  run_tag: null

sac:
  learning_rate: 0.00073
  learning_rate_schedule: linear
  policy_net_arch: [400, 300]
  buffer_size: 1000000
  batch_size: 256
  ent_coef: auto
  gamma: 0.99
  tau: 0.01
  train_freq: 1
  # Eight transitions per VecEnv step and eight updates preserve UTD about 1.
  gradient_steps: 8
  learning_starts: 10000

rbf:
  small_num_centers: 64
  large_num_centers: 192
  # For an 8D state, 2D action, and [400, 300] SAC MLP baseline:
  # strict RBF optimizer parameters = 62 * centers + 6 = 375,106 at 6,050;
  # RBF actor parameters = 20 * centers + 4 = 125,104 at 6,255.
  sac_strict_matched_num_centers: 6050
  sac_actor_matched_num_centers: 6255
  center_init_range: 1.0
  initial_bandwidth: 1.5
  min_bandwidth: 0.05
