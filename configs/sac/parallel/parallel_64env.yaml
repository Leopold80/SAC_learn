# 64-process sampling experiment for comparison with baseline MLP.
# gradient_steps = n_envs preserves the 1:1 gradient-update/transition ratio.

experiment:
  environment: LunarLanderContinuous-v3
  algorithm: SAC
  policy: MlpPolicy
  variants:
    - mlp

environment:
  frame_stack: 1
  n_envs: 64

training:
  timesteps: 499968
  seed: 42
  device: cuda
  allow_cpu: false
  progress_bar: false

evaluation:
  episodes: 10
  frequency: 9984

output:
  directory: outputs/lunarlander_parallel_64env
  tensorboard_log: runs/lunarlander_parallel_64env
  run_tag: seed42

sac:
  learning_rate: 0.00073
  learning_rate_schedule: linear
  policy_net_arch: [400, 300]
  buffer_size: 1000000
  batch_size: 256
  ent_coef: auto
  gamma: 0.99
  tau: 0.01
  train_freq: 1
  gradient_steps: 64
  learning_starts: 10000

ltc:
  liquid_hidden_dim: 128
  features_dim: 256
  raw_features_dim: 128
  fusion_hidden_dim: 256
  dt: 1.0
  tau_min: 0.1
  ode_unfolds: 4
  reversal_init_scale: 1.0
