# PPO 32-env full-command Go2 locomotion baseline (MuJoCo)
# Uses 50 Hz policy control, full planar velocity commands, and reset-time
# mass/friction/PD-gain domain randomization.

experiment:
  environment: Go2Locomotion-v0
  algorithm: PPO
  policy: MlpPolicy

environment:
  frame_stack: 1
  n_envs: 32

training:
  # 48,829 PPO rollouts. The validator requires total timesteps to be exactly
  # divisible by 32 envs * 64 steps = 2,048 transitions/update, so this is the
  # smallest valid value at or above 100 million.
  timesteps: 100_001_792
  seed: 42
  device: cuda
  allow_cpu: false
  progress_bar: true

evaluation:
  episodes: 20
  frequency: 65_536

output:
  directory: outputs/go2_ppo_32env_fixed
  tensorboard_log: runs/go2_ppo_32env_fixed
  run_tag: null

ppo:
  learning_rate: 0.0003
  learning_rate_schedule: constant
  policy_net_arch: [256, 256]
  n_steps: 64
  batch_size: 512
  n_epochs: 5
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  clip_range_vf: null
  normalize_advantage: true
  ent_coef: 0.01
  vf_coef: 1.0
  max_grad_norm: 1.0
  use_sde: false
  sde_sample_freq: -1
  target_kl: 0.01
