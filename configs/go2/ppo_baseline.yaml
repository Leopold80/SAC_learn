# PPO baseline for Unitree Go2 locomotion (MuJoCo)
# Parameters sourced from community-verified projects:
#   quadruped-robotics-stack, mujoco_playground, legged_gym

experiment:
  environment: Go2Locomotion-v0
  algorithm: PPO
  policy: MlpPolicy

environment:
  frame_stack: 1
  n_envs: 8

training:
  timesteps: 5_000_000
  seed: 42
  device: cuda
  allow_cpu: false
  progress_bar: true

evaluation:
  episodes: 10
  frequency: 50_000

output:
  directory: outputs/go2_ppo_baseline
  tensorboard_log: runs/go2_ppo_baseline
  run_tag: null

ppo:
  learning_rate: 0.0003
  learning_rate_schedule: constant
  policy_net_arch: [256, 256]
  n_steps: 1000
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  clip_range_vf: null
  normalize_advantage: true
  ent_coef: 0.001
  vf_coef: 0.5
  max_grad_norm: 0.5
  use_sde: false
  sde_sample_freq: -1
  target_kl: null
