# 524k control gate：保留 v2 相对误差奖励，只修复动作分布。

experiment:
  environment: Go2Locomotion-v0
  algorithm: PPO
  policy: TanhMlpPolicy

environment:
  frame_stack: 1
  n_envs: 16
  action_scale: 0.25
  command_x_range: [0.5, 0.5]
  command_y_range: [0.0, 0.0]
  command_yaw_range: [0.0, 0.0]
  domain_rand_mass: 0.0
  domain_rand_friction: 0.0
  domain_rand_kp: 0.0

reward:
  tracking_mode: relative_error
  tracking_linear_weight: 1.0
  tracking_yaw_weight: 0.5
  tracking_sigma: 0.25
  alive_weight: 0.1

training:
  timesteps: 524_288
  seed: 0
  device: cuda
  allow_cpu: false
  progress_bar: true

evaluation:
  episodes: 10
  frequency: 131_072
  seed: 10_000
  holdout_seed: 20_000
  holdout_episodes: 20
  command: [0.5, 0.0, 0.0]
  domain_randomization: false

output:
  directory: outputs/go2_ppo_stabilized_gate_relative
  tensorboard_log: runs/go2_ppo_stabilized_gate_relative
  run_tag: null

ppo:
  learning_rate: 0.0003
  learning_rate_schedule: constant
  policy_net_arch: [256, 256]
  n_steps: 128
  batch_size: 512
  n_epochs: 5
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  clip_range_vf: null
  normalize_advantage: true
  ent_coef: 0.0
  vf_coef: 1.0
  max_grad_norm: 1.0
  use_sde: false
  sde_sample_freq: -1
  target_kl: 0.01
  log_std_init: -1.0
  log_std_min: -5.0
  log_std_max: 0.0
