# Short CPU plumbing check for every SAC RBF variant. Rewards are not research results.

experiment:
  environment: LunarLanderContinuous-v3
  algorithm: SAC
  policy: MlpPolicy
  variants:
    - mlp
    - rbf_64
    - rbf_192
    - sac_rbf_matched
    - rbf_actor_mlp_critic_64
    - rbf_actor_mlp_critic_192
    - sac_rbf_actor_mlp_critic_matched

environment:
  frame_stack: 1
  n_envs: 2

training:
  timesteps: 64
  seed: 42
  device: cpu
  allow_cpu: true
  progress_bar: false

evaluation:
  episodes: 1
  frequency: 64

output:
  directory: outputs/lunarlander_sac_rbf_smoke
  tensorboard_log: runs/lunarlander_sac_rbf_smoke
  run_tag: null

sac:
  learning_rate: 0.00073
  learning_rate_schedule: linear
  # Keep the formal architecture so 6,050/6,255 retain their matching meaning.
  policy_net_arch: [400, 300]
  buffer_size: 10000
  batch_size: 16
  ent_coef: auto
  gamma: 0.99
  tau: 0.01
  train_freq: 1
  gradient_steps: 2
  learning_starts: 48

rbf:
  small_num_centers: 64
  large_num_centers: 192
  sac_strict_matched_num_centers: 6050
  sac_actor_matched_num_centers: 6255
  center_init_range: 1.0
  initial_bandwidth: 1.5
  min_bandwidth: 0.05
